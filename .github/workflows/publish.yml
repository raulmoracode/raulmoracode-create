name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag is semver
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::El tag '$tag' no es una versión semver válida. Se espera vX.Y.Z (por ejemplo v1.0.0)."
            exit 1
          fi

      - name: Resolve package name
        id: pkg
        run: echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con la versión $version de package.json."
            exit 1
          fi

      - name: Verify version is not already published
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "${{ steps.pkg.outputs.name }}@$version" version > /dev/null 2>&1; then
            echo "::error::La versión $version ya está publicada en npm. npm no permite sobrescribir una versión: incrementa la versión en package.json en lugar de reutilizarla."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Verify the build output
        run: |
          entry="$(node -p "require('./package.json').bin['raulmoracode-create']")"
          entry="${entry#./}"
          if [[ ! -f "$entry" ]]; then
            echo "::error::$entry is missing: pnpm build did not emit the bin entry point."
            exit 1
          fi
          if [[ "$(head -n1 "$entry")" != "#!/usr/bin/env node" ]]; then
            echo "::error::$entry lost its shebang, so the raulmoracode-create bin would not be executable."
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          if ! grep -rq "VERSION = \"$version\"" dist/; then
            echo "::error::No compiled module in dist/ carries VERSION = \\"$version\\". The published --version output would not match package.json."
            exit 1
          fi

      - name: Verify the tarball contents
        run: |
          entry="$(node -p "require('./package.json').bin['raulmoracode-create']")"
          listing="$(npm publish --dry-run --json)"
          for expected in "$entry" "package.json" "README.md" "LICENSE"; do
            if ! grep -q "\"path\": \"${expected#./}\"" <<< "$listing"; then
              echo "::error::$expected would not ship in the tarball."
              exit 1
            fi
          done
          echo "Tarball contents verified."

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify the published version was built from this commit
        run: |
          version="$(node -p "require('./package.json').version")"
          pkg="${{ steps.pkg.outputs.name }}"
          published=""
          for attempt in {1..30}; do
            published="$(npm view "$pkg@$version" gitHead 2>/dev/null || true)"
            [[ -n "$published" ]] && break
            echo "Attempt $attempt: $version is not visible in the registry yet (npm publishes asynchronously)."
            sleep 20
          done
          if [[ -z "$published" ]]; then
            echo "::error::npm never exposed $version after 10 minutes, so this run is inconclusive rather than proven. npm reported the package as published, so check https://www.npmjs.com/package/$pkg before assuming a failure."
            exit 1
          fi
          if [[ "$published" != "$GITHUB_SHA" ]]; then
            echo "::error::npm recorded gitHead '$published' for $version, but this run published commit '$GITHUB_SHA'. The registry and the git tag are out of sync."
            exit 1
          fi
          echo "npm and $GITHUB_REF_NAME agree: $version was built from $published."

