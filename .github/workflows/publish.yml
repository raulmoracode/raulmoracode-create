name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag is semver
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::El tag '$tag' no es una versión semver válida. Se espera vX.Y.Z (por ejemplo v1.0.0)."
            exit 1
          fi

      - name: Resolve package name
        id: pkg
        run: echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con la versión $version de package.json."
            exit 1
          fi

      - name: Verify version is not already published
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "${{ steps.pkg.outputs.name }}@$version" version > /dev/null 2>&1; then
            echo "::error::La versión $version ya está publicada en npm. npm no permite sobrescribir una versión: incrementa la versión en package.json en lugar de reutilizarla."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
